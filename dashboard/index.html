<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wonder Agency Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="demo-strip" id="mode-strip">Wonder Agency Console</div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Wonder">
      <svg class="brand-mark" viewBox="0 0 64 40" aria-hidden="true">
        <circle cx="26" cy="22" r="13" fill="currentColor"/>
        <ellipse cx="26" cy="22" rx="24" ry="7" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(-14 26 22)"/>
        <path d="M44 6l14-3-3 2.5 6 1-1.5 1.5-6-.5-4 4-1.5-.5 2-4-4.5.5z" fill="currentColor"/>
      </svg>
      <span class="brand-word">Wonder</span>
      <span class="brand-sub">Agency</span>
    </a>
    <label class="client-picker">
      <span class="micro">Client</span>
      <select id="client-select" aria-label="Client trip"></select>
    </label>
    <div class="topbar-right">
      <a class="btn primary" href="/onboarding/#onboard">New intake <span aria-hidden="true">→</span></a>
      <button class="pill-ghost" id="theme-toggle" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span id="theme-label">Evening</span>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" role="alert" hidden></div>

  <main id="main">
    <section class="hero" id="hero"></section>

    <section class="row">
      <article class="glass card" id="onboarding"></article>
      <article class="glass card" id="queue"></article>
    </section>

    <section class="agents-band">
      <div class="band-inner">
        <div class="section-head on-dark">
          <p class="micro">From “we should go” to “remember when”</p>
          <h2>Five agents,<br><span class="dim">one trip.</span></h2>
        </div>
        <div class="agents-layout">
          <ol class="agent-list" id="agent-list" role="tablist" aria-label="Agents"></ol>
          <div class="agent-detail" id="agent-detail" tabindex="-1" role="tabpanel"></div>
        </div>
      </div>
    </section>

    <section class="timeline-wrap">
      <div class="section-head">
        <p class="micro">Everything, in order</p>
        <h2>Activity</h2>
      </div>
      <ol class="timeline" id="timeline"></ol>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <footer class="foot" id="foot"></footer>
  <script src="app.js" type="module"></script>
</body>
</html>
