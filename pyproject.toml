[project]
name = "super-travel"
version = "0.1.0"
description = "Wonder travel agents and local control API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["super_travel"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["network: hits a live external API"]
